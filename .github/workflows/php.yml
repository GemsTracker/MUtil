name: PHP Composer

on:
  push:
    branches: [ "master", "2.x" ]
  pull_request:
    branches: [ "master", "2.x" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.4']
        stability: [prefer-lowest, prefer-stable]
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run test suite
      run: composer test

  phpstan:
    strategy:
      matrix:
        stability: [prefer-lowest, prefer-stable]
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.stability }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-prefer-stable-

      - name: Install dependencies
        run: COMPOSER_ROOT_VERSION=2.x-dev composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run phpstan
        run: vendor/bin/phpstan --no-progress
