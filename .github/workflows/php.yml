name: PHP Composer

on:
  push:
    branches: [ "master", "2.x" ]
  pull_request:
    branches: [ "master", "2.x" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        stability: [prefer-lowest, prefer-stable]
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run test suite
      run: composer test
